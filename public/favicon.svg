<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- 书本图标 -->
  <path d="M 30 25 L 30 75 L 50 70 L 70 75 L 70 25 L 50 30 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 30 25 L 50 30 L 70 25" stroke="#4A90E2" stroke-width="2" fill="none"/>
  <path d="M 30 50 L 70 50" stroke="#4A90E2" stroke-width="1.5" opacity="0.6"/>
  
  <!-- 字母 T (代表 TOEIC) -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#4A90E2" text-anchor="middle">T</text>
</svg>

